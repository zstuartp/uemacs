name: C/C++ CI

on:
  push:
    branches: [ "master", "testing" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libhunspell-dev             libncurses-dev             pkg-config
      - name: Build
        run: |
          set -eux
          make

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew update
          brew install hunspell ncurses pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix hunspell)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix ncurses)/include -I$(brew --prefix hunspell)/include $CPPFLAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix ncurses)/lib -L$(brew --prefix hunspell)/lib $LDFLAGS" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -eux
          make

  build-freebsd:
    name: FreeBSD (VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: "14.3"
          prepare: |
            set -eux
            pkg update -f
            pkg install -y gmake pkgconf hunspell ncurses
          run: |
            set -eux
            gmake

  build-windows-msys2:
    name: Windows (MSYS2 POSIX)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          # MSYS provides POSIX headers like <sys/ioctl.h>
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            pkgconf
            hunspell
            ncurses

      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -eux
          make
