name: C/C++ CI

on:
  push:
    branches: [ "master", "testing" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhunspell-dev libncurses-dev pkg-config
      - name: Build
        run: |
          set -eux
          make
      - name: Test
        run: |
          set -eux
          make test
      - name: Perf Snapshot (Linux)
        run: |
          set -eux
          VERSION_ITERS=100 \
          HELP_ITERS=60 \
          REF_ITERS=120 \
          STARTUP_EMPTY_ITERS=4 \
          STARTUP_LOAD_ITERS=3 \
          TYPE_ITERS=3 \
          KEY_ITERS=3 \
          PERF_TRIALS=1 \
          PERF_MIN_SECONDS=1 \
          PERF_MAX_ITERS=1024 \
          BENCH_FILE_LINES=512 \
          TYPE_COMMANDS=64 \
          KEY_COMMANDS=64 \
          make test-perf
      - name: Perf Summary (Linux)
        run: |
          set -eu
          {
            echo "### Linux Perf Snapshot"
            echo
            echo '```'
            cat build/perf-current.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Perf Artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: perf-linux-${{ github.run_id }}
          path: build/perf-current.txt

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew update
          brew install hunspell ncurses pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix hunspell)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix ncurses)/include -I$(brew --prefix hunspell)/include $CPPFLAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix ncurses)/lib -L$(brew --prefix hunspell)/lib $LDFLAGS" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -eux
          make
      - name: Test
        run: |
          set -eux
          make test

  build-freebsd:
    name: FreeBSD (VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: "14.3"
          prepare: |
            set -eux
            pkg update -f
            pkg install -y gmake pkgconf hunspell ncurses
          run: |
            set -eux
            gmake
            gmake test

  build-windows-cygwin:
    name: Windows (Cygwin POSIX)
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4

      - name: Install Cygwin + deps
        id: cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            gcc-core
            gcc-g++
            make
            pkg-config
            libhunspell-devel
            libncurses-devel

      - name: Build
        shell: pwsh
        run: |
          $bash = "${{ steps.cygwin.outputs.root }}\bin\bash.exe"
          & $bash -lc 'set -eux; cd "$(cygpath -u "$GITHUB_WORKSPACE")"; make'
      - name: Test
        shell: pwsh
        run: |
          $bash = "${{ steps.cygwin.outputs.root }}\bin\bash.exe"
          & $bash -lc 'set -eux; cd "$(cygpath -u "$GITHUB_WORKSPACE")"; make test'
